[platformio]
default_envs = esp32

[env:esp32]
platform = espressif32
framework = arduino
board = esp32dev
board_build.mcu = esp32s2
board_build.f_cpu = 80000000L
lib_deps =
    NeoPixelBus
    nawotech/timer @ ^1.0.1
    nawotech/button @ 1.0.0
    https://github.com/cammiboi/KXTJ3-1057.git#misc-improvements

[env:esp32_test]
platform = espressif32
framework = arduino
board = esp32dev
board_build.mcu = esp32s2
board_build.f_cpu = 80000000L
upload_port = /dev/cu.usbmodem01
src_filter =
    +<>
    -<src>
    +<../test_esp32>
lib_deps =
    NeoPixelBus
    nawotech/timer @ ^1.0.1
    nawotech/button @ 1.0.0
    https://github.com/cammiboi/KXTJ3-1057.git#add-self-test
    bblanchon/ArduinoJson @ ^6.18.5

[env:test_native]
platform = native
build_flags = 
    -std=gnu++11
lib_extra_dirs =
    ./test/mocks
lib_deps = 
    ArduinoFake
src_filter =
    +<>
    -<../lib/analog>
debug_test = test_main